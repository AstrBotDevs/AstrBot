schema_version: 2
name: sdk_llm_tools_agent
desc: Dedicated new-SDK plugin exercising ToolService, tools, LLMService, providers, speech, and agent loop.
author: astrbot
version: 1.0.0
runtime:
  api: sdk
  entrypoint: main:SdkLlmToolsAgentPlugin
  sdk_version: ">=0.1,<0.2"
capabilities:
  required:
    - id: message.receive
    - id: llm.tool.register
    - id: llm.generate
    - id: llm.embed
    - id: speech.synthesize
    - id: speech.transcribe
    - id: llm.agent
