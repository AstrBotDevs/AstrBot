<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AstrBot {{ version }}</title>
  <style>
    :root {
      --paper: #fbfbfa;
      --ink: #202224;
      --muted: #666b70;
      --line: #d9dcde;
      --soft-line: #d4d8db;
      --strong-line: #bcc2c6;
      --soft-fill: #f2f3f3;
      --accent: #2f86bd;
      --code-fill: #f4f5f5;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      background: var(--paper);
    }

    body {
      min-width: 320px;
      margin: 0;
      padding: 0 32px;
      overflow-x: hidden;
      color: var(--ink);
      background: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
      font-size: 25px;
      font-weight: 400;
      line-height: 1.72;
      text-rendering: optimizeLegibility;
      overflow-wrap: break-word;
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(100%, 920px);
      margin: 0 auto;
      padding: 30px 0 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
    }

    .wordmark {
      font-size: 28px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .version {
      color: var(--muted);
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    main {
      width: min(100%, 920px);
      margin: 0 auto;
      padding: 42px 0 60px;
    }

    #content > :first-child {
      margin-top: 0;
    }

    #content > :last-child {
      margin-bottom: 0;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      color: var(--ink);
      font-weight: 720;
      line-height: 1.28;
      text-wrap: balance;
    }

    h1 {
      margin: 0 0 0.62em;
      font-size: 2em;
      letter-spacing: -0.035em;
    }

    h2 {
      margin: 1.65em 0 0.62em;
      padding-top: 0.45em;
      border-top: 1px solid var(--soft-line);
      font-size: 1.5em;
      letter-spacing: -0.025em;
    }

    h3 {
      margin: 1.4em 0 0.52em;
      font-size: 1.24em;
      letter-spacing: -0.015em;
    }

    h4 {
      margin: 1.25em 0 0.45em;
      font-size: 1.06em;
    }

    h5,
    h6 {
      margin: 1.15em 0 0.4em;
      font-size: 0.92em;
    }

    h6 {
      color: var(--muted);
    }

    p {
      margin: 0.78em 0;
      white-space: normal;
    }

    strong {
      font-weight: 720;
    }

    em {
      font-style: italic;
    }

    a {
      color: var(--accent);
      text-decoration-color: color-mix(in srgb, var(--accent) 55%, transparent);
      text-decoration-line: underline;
      text-decoration-thickness: 0.06em;
      text-underline-offset: 0.16em;
    }

    hr {
      height: 1px;
      margin: 1.55em 0;
      border: 0;
      background: var(--soft-line);
    }

    hr + h2 {
      margin-top: 1em;
      padding-top: 0;
      border-top: 0;
    }

    ul,
    ol {
      margin: 0.75em 0;
      padding-left: 1.45em;
    }

    li {
      padding-left: 0.15em;
    }

    li + li {
      margin-top: 0.28em;
    }

    li::marker {
      color: var(--accent);
      font-weight: 650;
    }

    li > p {
      margin: 0.35em 0;
    }

    li.task-list-item {
      margin-left: -1.35em;
      padding-left: 0;
      list-style: none;
    }

    .task-list-item input[type="checkbox"] {
      width: 0.9em;
      height: 0.9em;
      margin: 0 0.5em 0 0;
      vertical-align: -0.05em;
      accent-color: var(--accent);
    }

    blockquote {
      margin: 1.15em 0;
      padding: 0.75em 1em;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: #4d5256;
      background: var(--soft-fill);
    }

    blockquote > :first-child {
      margin-top: 0;
    }

    blockquote > :last-child {
      margin-bottom: 0;
    }

    code,
    kbd,
    samp {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    :not(pre) > code {
      padding: 0.12em 0.35em;
      border: 1px solid var(--soft-line);
      border-radius: 3px;
      color: #273a33;
      background: var(--code-fill);
      font-size: 0.84em;
      overflow-wrap: anywhere;
    }

    pre {
      max-width: 100%;
      margin: 1.15em 0;
      padding: 1em 1.1em;
      overflow: visible;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--code-fill);
      font-size: 0.76em;
      line-height: 1.58;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      tab-size: 2;
    }

    pre > code {
      display: block;
      padding: 0;
      border: 0;
      color: inherit;
      background: transparent;
      font-size: inherit;
      line-height: inherit;
      white-space: inherit;
    }

    pre.shiki {
      padding: 1em 1.1em;
      background: var(--code-fill) !important;
      white-space: pre-wrap;
    }

    pre.shiki > code {
      padding: 0;
      background: transparent !important;
      color: inherit;
      white-space: inherit;
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 1.2em auto;
      border: 1px solid var(--line);
    }

    table {
      width: 100%;
      margin: 1.2em 0;
      overflow: hidden;
      border: 1px solid var(--strong-line);
      border-collapse: separate;
      border-spacing: 0;
      border-radius: 4px;
      background: #fdfdfc;
      font-size: 0.82em;
      line-height: 1.5;
    }

    th,
    td {
      padding: 0.65em 0.75em;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      overflow-wrap: break-word;
      word-break: normal;
    }

    th + th,
    td + td {
      border-left: 1px solid var(--line);
    }

    th {
      color: var(--ink);
      border-bottom-color: var(--strong-line);
      background: #eef1f2;
      font-weight: 700;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    tbody tr:nth-child(even) {
      background: #f7f8f8;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    th[align="center"],
    td[align="center"] {
      text-align: center;
      white-space: nowrap;
    }

    th[align="right"],
    td[align="right"] {
      text-align: right;
      white-space: nowrap;
    }

    caption {
      padding: 0 0 0.55em;
      color: var(--muted);
      font-size: 0.9em;
      text-align: left;
    }

    details {
      margin: 1.05em 0;
      padding: 0.65em 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    summary {
      cursor: pointer;
      font-weight: 680;
    }

    summary::marker {
      color: var(--accent);
    }

    details[open] summary {
      margin-bottom: 0.65em;
    }

    mark {
      padding: 0.05em 0.2em;
      color: inherit;
      background: #e9e0aa;
    }

    del {
      color: var(--muted);
    }

    .katex-display,
    .math-fallback {
      max-width: 100%;
      margin: 1.1em 0;
      overflow-x: auto;
      overflow-y: hidden;
      font-size: 0.95em;
    }

    @media (max-width: 700px) {
      body {
        padding: 0 14px;
        font-size: 21px;
      }

      .masthead {
        padding-top: 18px;
      }

      main {
        padding: 34px 0 46px;
      }

      h1 {
        font-size: 1.72em;
      }

      h2 {
        font-size: 1.38em;
      }

      table {
        font-size: 0.75em;
      }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <span class="brand">
      <svg class="brand-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <g transform="translate(0.8 0.9)">
          <g transform="translate(0 32)">
            <path d="m246.3 328.1-17.8 41.2c-6.4 14.8-26.9 14.8-33.3 0l-17.8-41.2c-14.9-34.2-41.8-61.4-75.3-76.3l-48.8-21.6c-14.7-6.5-14.7-27.9 0-34.4l47.2-21c34.4-15.3 61.7-43.5 76.4-78.8l18-43.7c6.3-15.2 27.3-15.2 33.6 0l18 43.7c14.7 35.3 42 63.6 76.4 78.8l47.2 21c14.7 6.5 14.7 27.9 0 34.4l-48.8 21.6c-33.5 14.8-60.4 42.1-75.3 76.2z" fill="#2f86bd" transform="translate(0 35)" />
            <path d="m402.2 449.3-5.3 12.2c-3.5 7.9-14.4 7.9-17.9 0l-5.3-12.2c-8.4-19.3-23.6-34.6-42.4-43l-15.4-6.9c-7.9-3.5-7.9-14.9 0-18.4l14.5-6.5c19.4-8.6 34.8-24.5 43.1-44.5l5.4-13.1c3.4-8.1 14.6-8.1 18 0l5.4 13.1c8.3 19.9 23.7 35.8 43.1 44.5l14.5 6.5c7.9 3.5 7.9 14.9 0 18.4l-15.4 6.9c-19 8.3-34.1 23.7-42.5 43z" fill="#2f86bd" transform="matrix(0.95 0 0 0.95 22 -278)" />
          </g>
        </g>
      </svg>
      <span class="wordmark">AstrBot</span>
    </span>
    <span class="version">{{ version }}</span>
  </header>

  <main>
    <article id="content">{{ rendered_html | safe }}</article>
  </main>

  <script>
    (function () {
      const contentElement = document.getElementById("content");
      if (window.AstrBotT2IShiki) {
        window.AstrBotT2IShiki.highlightAllCodeBlocks(contentElement, "github-light");
      }

      contentElement
        .querySelectorAll(".katex-display, .math-fallback")
        .forEach(function (displayElement) {
          const availableWidth = displayElement.clientWidth;
          const renderedWidth = displayElement.scrollWidth;
          if (availableWidth > 0 && renderedWidth > availableWidth) {
            const fontSize = parseFloat(
              window.getComputedStyle(displayElement).fontSize
            );
            displayElement.style.fontSize =
              `${fontSize * (availableWidth / renderedWidth) * 0.98}px`;
          }
        });
    })();
  </script>
</body>
</html>
