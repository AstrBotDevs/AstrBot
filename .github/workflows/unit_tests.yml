name: Unit Tests

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README*.md'
      - 'changelogs/**'
      - 'dashboard/**'
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Run pytest suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    # The Windows lane stays best-effort for now: the suite still has
    # pre-existing Windows-specific failures there. Promote to blocking
    # once those tests are fixed.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    defaults:
      run:
        # Windows runners default to pwsh; use bash so the same steps and
        # test script work on all three platforms.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Install Linux sandbox and audio test dependencies
        if: runner.os == 'Linux'
        run: |
          # Keep suites and signing keys while avoiding the slow Azure archive route.
          source_files=(/etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources)
          ubuntu_mirrorlist_referenced=0
          for source_file in "${source_files[@]}"; do
            if [ -f "$source_file" ] && [ ! -L "$source_file" ] &&
              sed -n '/^[[:space:]]*\(deb\(-src\)\?[[:space:]]\|URIs:\|mirror+file:\)/p' "$source_file" |
                grep -Eq '(^|[[:space:]])mirror\+file:/+etc/apt/apt-mirrors\.txt([[:space:]]|$)'; then
              ubuntu_mirrorlist_referenced=1
              source_files+=(/etc/apt/apt-mirrors.txt)
              break
            fi
          done
          if [ "$ubuntu_mirrorlist_referenced" = 1 ] &&
            { [ ! -f /etc/apt/apt-mirrors.txt ] || [ -L /etc/apt/apt-mirrors.txt ]; }; then
            printf '%s\n' 'Referenced Ubuntu mirrorlist is missing or is a symlink.' >&2
            exit 1
          fi
          rewritten_source_files=0
          for source_file in "${source_files[@]}"; do
            if [ -f "$source_file" ] && [ ! -L "$source_file" ]; then
              source_hash_before="$(sha256sum "$source_file")"
              sudo sed -Ei '
                /^[[:space:]]*(deb(-src)?[[:space:]]|URIs:|https?:\/\/)/ {
                  :azure
                  s#(^|[[:space:]])https?://azure\.archive\.ubuntu\.com/ubuntu/?([[:space:]]|$)#\1https://archive.ubuntu.com/ubuntu/\2#g
                  t azure
                }
              ' "$source_file"
              if [ "$source_hash_before" != "$(sha256sum "$source_file")" ]; then
                printf 'Rewrote Azure Ubuntu URI in %q\n' "$source_file"
                rewritten_source_files=$((rewritten_source_files + 1))
              fi
            fi
          done
          printf 'Rewritten APT source files: %s\n' "$rewritten_source_files"
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          index_uris="$(apt-get indextargets --format '$(URI)')"
          if ! grep -q '[^[:space:]]' <<< "$index_uris"; then
            printf '%s\n' 'APT index check returned no active indexes.' >&2
            exit 1
          fi
          if grep -Eiq '^https?://([^/@]+@)?azure\.archive\.ubuntu\.com(:[0-9]+)?/ubuntu(/|$)' <<< "$index_uris"; then
            printf '%s\n' 'Azure Ubuntu index remains active; check APT source paths above.' >&2
            exit 1
          fi
          mirror_index_uris="$(grep -E '^mirror\+' <<< "$index_uris" || true)"
          if grep -Evq '^mirror\+file:/+etc/apt/apt-mirrors\.txt(/|$)|^[[:space:]]*$' <<< "$mirror_index_uris"; then
            printf '%s\n' 'APT index check found an unverified mirror URI.' >&2
            exit 1
          fi
          if grep -Eq '^mirror\+file:' <<< "$index_uris" &&
            [ "$ubuntu_mirrorlist_referenced" != 1 ]; then
            printf '%s\n' 'APT index check could not verify the Ubuntu mirrorlist reference.' >&2
            exit 1
          fi
          if [ "$ubuntu_mirrorlist_referenced" = 1 ] &&
            grep -Eiq '^[[:space:]]*https?://([^/@]+@)?azure\.archive\.ubuntu\.com(:[0-9]+)?/ubuntu(/|[[:space:]]|$)' /etc/apt/apt-mirrors.txt; then
            printf '%s\n' 'Azure Ubuntu entry remains in the referenced /etc/apt/apt-mirrors.txt.' >&2
            exit 1
          fi
          printf '%s\n' 'APT index check: no active Azure Ubuntu URI.'
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y bubblewrap ffmpeg

      - name: Install FFmpeg for audio tests
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ffmpeg -y --no-progress
          else
            brew install ffmpeg
          fi
          ffmpeg -version

      - name: Enable and verify Linux sandbox execution
        if: runner.os == 'Linux'
        run: |
          # Ubuntu's AppArmor policy blocks user-namespace capabilities by default.
          # Allow them on this ephemeral runner so the real sandbox tests can run.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / /bin/true

      - name: Verify macOS sandbox dependency
        if: runner.os == 'macOS'
        run: test -x /usr/bin/sandbox-exec

      - name: Diagnose macOS converter address space
        if: runner.os == 'macOS'
        run: |
          for mode in default nano-off; do
            if [ "$mode" = nano-off ]; then
              export MallocNanoZone=0
            fi
            DIAG_MODE="$mode" python - <<'PY'
          import os
          import resource
          import subprocess

          requested = 512 * 1024 * 1024
          soft, hard = resource.getrlimit(resource.RLIMIT_AS)
          target = min(
              [requested]
              + [limit for limit in (soft, hard) if limit != resource.RLIM_INFINITY]
          )
          try:
              vsize_kib = subprocess.run(
                  ("ps", "-o", "vsz=", "-p", str(os.getpid())),
                  capture_output=True,
                  text=True,
                  timeout=1,
                  check=False,
              ).stdout.strip() or "unavailable"
          except Exception:
              vsize_kib = "unavailable"
          try:
              resource.setrlimit(resource.RLIMIT_AS, (target, target))
              result = "accepted"
          except (OSError, ValueError) as exc:
              result = f"{type(exc).__name__}: {exc}"
          print(
              f"{os.environ['DIAG_MODE']} RLIMIT_AS soft={soft} hard={hard} "
              f"requested={requested} target={target} vsize_kib={vsize_kib} "
              f"result={result}"
          )
          PY
          done

      - name: Run tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          chmod +x scripts/run_pytests_ci.sh
          if [ "${{ runner.os }}" = "Linux" ]; then
            bash ./scripts/run_pytests_ci.sh ./tests --cov=astrbot --cov-report=xml
          else
            bash ./scripts/run_pytests_ci.sh ./tests
          fi

      - name: Upload coverage
        if: runner.os == 'Linux' && github.repository == 'AstrBotDevs/AstrBot'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
