name: Unit Tests

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README*.md'
      - 'changelogs/**'
      - 'dashboard/**'
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Run pytest suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    # The Windows lane stays best-effort for now: the suite still has
    # pre-existing Windows-specific failures there. Promote to blocking
    # once those tests are fixed.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    defaults:
      run:
        # Windows runners default to pwsh; use bash so the same steps and
        # test script work on all three platforms.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Run tests
        run: |
          chmod +x scripts/run_pytests_ci.sh
          bash ./scripts/run_pytests_ci.sh ./tests
