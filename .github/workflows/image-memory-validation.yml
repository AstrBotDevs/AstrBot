name: Image Memory Lifecycle Validation

on:
  push:
    branches:
      - feat/optimize-image-memory-lifecycle
  workflow_dispatch:

jobs:
  validate:
    name: Image and memory validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run repository ruff checks
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Run focused tests
        run: |
          uv run pytest -q \
            tests/unit/test_image_preparation_budget.py \
            tests/unit/test_image_media_store.py \
            tests/test_media_utils.py \
            tests/test_tool_loop_agent_runner.py \
            tests/agent/test_context_manager.py \
            tests/unit/test_astr_main_agent.py \
            tests/unit/test_context_image_budget.py \
            tests/unit/test_image_source_preparation.py \
            tests/unit/test_image_memory_benchmark.py \
            tests/unit/test_provider_request_retry.py \
            tests/unit/test_manage_image_history.py \
            tests/unit/test_conversation_media_api.py

      - name: Generate reproducible fixtures outside the measured process
        run: |
          mkdir -p "$RUNNER_TEMP/image-memory-validation/fixtures"
          uv run python scripts/image_memory_bench/generate_fixtures.py \
            "$RUNNER_TEMP/image-memory-validation/fixtures" --seeds 7

      - name: Record versions and fixture manifest
        run: |
          mkdir -p "$RUNNER_TEMP/image-memory-validation/results"
          uv run python scripts/image_memory_bench/baseline_manifest.py \
            "$RUNNER_TEMP/image-memory-validation/results/manifest.json" \
            --fixtures "$RUNNER_TEMP/image-memory-validation/fixtures"

      - name: Run ordinary and stress memory harness workloads
        run: |
          result="$RUNNER_TEMP/image-memory-validation/results/measurements.jsonl"
          while IFS= read -r image; do
            uv run python scripts/image_memory_bench/measure.py \
              "$image" "$result" \
              --repo "$GITHUB_WORKSPACE" \
              --workload "$(basename "$image")"
          done < <(find "$RUNNER_TEMP/image-memory-validation/fixtures/7" -type f \
            \( -name '*ordinary*' -o -name '*stress*' \) | sort)

      - name: Upload raw validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-memory-validation-${{ matrix.os }}
          path: ${{ runner.temp }}/image-memory-validation
          if-no-files-found: error
