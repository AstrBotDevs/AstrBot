name: Test GitHub Project Sync

on:
  pull_request:
    paths:
      - '.github/workflows/project-sync*.yml'
      - 'scripts/sync_github_project.py'
      - 'tests/test_sync_github_project.py'
      - 'tests/test_project_events.py'
  push:
    branches: [master]
    paths:
      - '.github/workflows/project-sync*.yml'
      - 'scripts/sync_github_project.py'
      - 'tests/test_sync_github_project.py'
      - 'tests/test_project_events.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Run network-free regression tests
        run: |
          uv run --no-project python -I tests/test_sync_github_project.py -v
          uv run --no-project python -I tests/test_project_events.py -v
