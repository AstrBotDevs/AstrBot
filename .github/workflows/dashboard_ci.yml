name: AstrBot Dashboard CI

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 11.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          cache: "pnpm"
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      - name: Check i18n keys
        working-directory: dashboard
        run: pnpm run i18n:check

      - name: Lint, test, and build
        working-directory: dashboard
        run: |
          pnpm typecheck:config
          pnpm lint:check
          pnpm test:unit
          pnpm run build

      - name: Inject Commit SHA
        id: get_sha
        run: |
          COMMIT_SHA="$(git rev-parse HEAD)"
          printf 'COMMIT_SHA=%s\n' "$COMMIT_SHA" >> "$GITHUB_ENV"
          mkdir -p dashboard/dist/assets
          printf '%s\n' "$COMMIT_SHA" > dashboard/dist/assets/version
          cd dashboard
          zip -r dist.zip dist

      - name: Archive production artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-without-markdown
          path: |
            dashboard/dist
            !dashboard/dist/**/*.md

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'AstrBotDevs/AstrBot'
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: release-${{ github.sha }}
          owner: AstrBotDevs
          repo: astrbot-release-harbour
          body: "Automated release from commit ${{ github.sha }}"
          token: ${{ secrets.ASTRBOT_HARBOUR_TOKEN }}
          artifacts: "dashboard/dist.zip"
