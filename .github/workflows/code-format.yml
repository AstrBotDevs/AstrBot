name: Code Format Check

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  format-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        
    - name: Install UV
      run: pip install uv
      
    - name: Install dependencies
      run: uv sync --locked --group dev

    - name: Verify generated requirements
      shell: bash
      run: |
        uv export --frozen --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
        diff -u requirements.txt "$RUNNER_TEMP/requirements.txt"
      
    - name: Check code formatting with ruff
      run: |
        uvx --from ruff==0.15.22 ruff format --check .
        
    - name: Check code style with ruff
      run: |
        uvx --from ruff==0.15.22 ruff check .
