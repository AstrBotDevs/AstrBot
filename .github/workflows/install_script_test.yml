name: Test Windows install script

on:
  push:
    branches:
      - master
    paths:
      - 'docs/public/install.ps1'
      - 'tests/install_script.Tests.ps1'
      - '.github/workflows/install_script_test.yml'
  pull_request:
    paths:
      - 'docs/public/install.ps1'
      - 'tests/install_script.Tests.ps1'
      - '.github/workflows/install_script_test.yml'
  workflow_dispatch:

jobs:
  test:
    name: Windows PowerShell compatibility
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test Windows PowerShell 5.1
        shell: powershell
        run: .\tests\install_script.Tests.ps1

      - name: Test PowerShell 7
        shell: pwsh
        run: .\tests\install_script.Tests.ps1
