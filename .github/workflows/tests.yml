name: Tests

on:
  push:
    branches:
      - master
    paths-ignore:
      - README*.md
      - changelogs/**
      - dashboard/**
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
      - run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run scripts/smoke_startup_check.py

  unit-tests:
    needs: smoke-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Sandbox for Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu's AppArmor policy blocks user-namespace capabilities by default.
          # Allow them on this ephemeral runner so the real sandbox tests can run.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / /bin/true

      - name: Sandbox for macOS
        if: runner.os == 'macOS'
        run: test -x /usr/bin/sandbox-exec

      - run: bash ./scripts/run_pytests_ci.sh ./tests
