name: Docs CI

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs_ci.yml"
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/workflows/docs_ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.13.0"
          cache: "pnpm"
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./docs

      - name: Test LLM documentation generator
        run: pnpm run docs:test
        working-directory: ./docs

      - name: Build documentation
        run: pnpm run docs:build
        working-directory: ./docs

      - name: Verify generated documentation
        working-directory: ./docs
        run: |
          test -f .vitepress/dist/llms.txt
          test -f .vitepress/dist/llms-full.txt
          test -f .vitepress/dist/llms-zh.txt
          test -f .vitepress/dist/llms-en.txt
          test -f .vitepress/dist/raw/zh/index.md
          test -f .vitepress/dist/raw/en/index.md
