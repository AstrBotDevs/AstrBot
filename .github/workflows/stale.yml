# 自动关闭不活跃或不符合规范的 Issue 和 PR
# 文档: https://github.com/actions/stale
name: Close stale issues and PRs

on:
  schedule:
    # 每天 UTC 08:30 执行 (北京时间 16:30)
    - cron: '30 8 * * *'
  workflow_dispatch:

jobs:
  stale:
    if: github.repository == 'AstrBotDevs/AstrBot'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      # 标记并关闭长期不活跃的 Issue 和 PR
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operations-per-run: 200

          # Issue 策略
          # 60 天无活动标记 stale, 再过 30 天关闭
          days-before-issue-stale: 60
          days-before-issue-close: 30
          stale-issue-label: 'stale'
          # 豁免标签 (此标签不会自动关闭)
          exempt-issue-labels: 'pinned,security,help wanted,wontfix'

          stale-issue-message: |
            This issue has been automatically marked as **stale** because it has not had any activity.
            It will be closed in 30 days if no further activity occurs.
            If this issue is still relevant, please leave a comment.

            ---

            该 Issue 已 60 天无活动, 已被标记为 `stale`。
            如 30 天内无后续活动, 将自动关闭。如仍需跟进, 请回复评论。
          close-issue-message: |
            This issue has been automatically closed due to inactivity.
            If the problem still exists, feel free to reopen or create a new issue with updated information.

            ---

            该 Issue 因长期无活动已自动关闭。
            如问题仍存在, 欢迎补充复现信息并重新打开或新建 Issue。


          # PR 策略
          # 60 天无活动标记 stale, 再过 30 天关闭
          days-before-pr-stale: 60
          days-before-pr-close: 30
          stale-pr-label: 'stale'
          # 豁免标签 (此标签不会自动关闭)
          exempt-pr-labels: 'dependencies,security'
          exempt-draft-pr: true

          stale-pr-message: |
            This PR has been automatically marked as **stale** because it has not had any activity.
            It will be closed in 30 days if no further activity occurs.
            Please push updates or ping a maintainer for review.

            ---

            该 PR 已 60 天无更新, 已被标记为 `stale`。
            如 30 天内无后续活动, 将自动关闭。请更新代码或联系维护者 review。
          close-pr-message: |
            This PR has been automatically closed due to inactivity.
            Feel free to reopen once the changes are complete.

            ---

            该 PR 因长期无更新已自动关闭。完成修改后可重新打开。


          # 有更新/评论自动移除 stale 标签并重新计时
          remove-stale-when-updated: true

      # 无归类标签的 issue
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operations-per-run: 200

          # 只处理 Issue，禁用 PR
          days-before-pr-stale: -1
          days-before-pr-close: -1

          # 3 天无活动标记 needs-triage，再 7 天关闭
          days-before-issue-stale: 3
          days-before-issue-close: 7
          stale-issue-label: 'needs-triage'
          # 处理没有下列标签的 issue
          exempt-issue-labels: 'pinned,security,help wanted,wontfix,stale,bug,enhancement,question,documentation,invalid'

          stale-issue-message: |
            This issue has not been categorized (no bug/enhancement/question label) and will be closed in 7 day.
            Please add an appropriate label or provide more information.

            ---

            该 Issue 提交后未被归类，7 天后将自动关闭。
            请使用提供的提交模板重新提交或添加合适的标签并补充信息。
          close-issue-message: |
            This issue was closed because it was not categorized.
            Feel free to reopen with more details.

            ---

            该 Issue 因未归类已自动关闭。可补充信息后重新打开。

          # 有更新/评论自动移除 needs-triage 标签并重新计时
          remove-stale-when-updated: true