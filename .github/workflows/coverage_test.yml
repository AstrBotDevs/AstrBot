name: Run tests and upload coverage

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'changelogs/**'
      - 'dashboard/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14.6'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Install dependencies
        run: |
          uv sync --group dev --locked

      - name: Run tests
        run: |
          mkdir -p data/plugins
          mkdir -p data/config
          mkdir -p data/temp
          export TESTING=true
          export ZHIPU_API_KEY=${{ secrets.OPENAI_API_KEY }}
          uv run pytest --test-profile all --cov=astrbot --cov-branch \
            --cov-report=xml --cov-report=json --cov-report=term -q --tb=short
          uv run python scripts/check_function_coverage.py \
            --coverage-file coverage.json --min 99

      - name: Check Codecov configuration
        id: codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: echo "enabled=$([[ -n \"$CODECOV_TOKEN\" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload results to Codecov
        if: steps.codecov.outputs.enabled == 'true'
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
