name: Docker Image CI/CD

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Git tag to build and publish (for example: v4.28.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-nightly-image:
    if: github.repository == 'AstrBotDevs/AstrBot' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: astrbot-docker-nightly
      cancel-in-progress: false
    env:
      HAS_GHCR_TOKEN: ${{ secrets.GHCR_GITHUB_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Check for new commits today
        id: check-commits
        shell: bash
        run: |
          commits="$(git log --since="24 hours ago" --oneline)"
          if [ -z "$commits" ]; then
            echo "has_commits=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_commits=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Exit if no commits
        if: steps.check-commits.outputs.has_commits == 'false'
        run: exit 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.13.0'
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Build Dashboard
        shell: bash
        run: |
          dashboard_version="$(python3 - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as project_file:
              print("v" + tomllib.load(project_file)["project"]["version"])
          PY
          )"
          pnpm --dir dashboard install --frozen-lockfile
          pnpm --dir dashboard run build
          mkdir -p dashboard/dist/assets
          printf '%s\n' "$dashboard_version" > dashboard/dist/assets/version
          mkdir -p astrbot/dashboard
          cp -a dashboard/dist astrbot/dashboard/dist

      - name: Determine nightly image tags
        id: image-meta
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "lock_sha256=$(sha256sum uv.lock | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite immutable nightly tag
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_GITHUB_TOKEN }}
          NIGHTLY_TAG: nightly-${{ steps.image-meta.outputs.build_date }}-${{ steps.image-meta.outputs.short_sha }}
        shell: bash
        run: |
          set -euo pipefail
          hub_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://hub.docker.com/v2/repositories/${DOCKER_HUB_USERNAME}/astrbot/tags/${NIGHTLY_TAG}/")"
          if [ "$hub_status" != "404" ]; then
            echo "Docker Hub nightly tag ${NIGHTLY_TAG} already exists or cannot be checked (HTTP ${hub_status})." >&2
            exit 1
          fi
          if [ -n "$GHCR_TOKEN" ]; then
            ghcr_bearer="$(
              curl --fail --silent --show-error \
                --user "astrbotdevs:${GHCR_TOKEN}" \
                "https://ghcr.io/token?service=ghcr.io&scope=repository:astrbotdevs/astrbot:pull" \
                | python3 -c 'import json, sys; print(json.load(sys.stdin).get("token", ""))'
            )"
            if [ -z "$ghcr_bearer" ]; then
              echo "Could not acquire a GHCR read token for immutable-tag verification." >&2
              exit 1
            fi
            ghcr_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer ${ghcr_bearer}" \
              --header 'Accept: application/vnd.oci.image.index.v1+json' \
              "https://ghcr.io/v2/astrbotdevs/astrbot/manifests/${NIGHTLY_TAG}")"
            if [ "$ghcr_status" != "404" ]; then
              echo "GHCR nightly tag ${NIGHTLY_TAG} already exists or cannot be checked (HTTP ${ghcr_status})." >&2
              exit 1
            fi
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Log in to GitHub Container Registry
        if: env.HAS_GHCR_TOKEN == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: astrbotdevs
          password: ${{ secrets.GHCR_GITHUB_TOKEN }}

      - name: Build and push nightly image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=nightly-${{ steps.image-meta.outputs.build_date }}-${{ steps.image-meta.outputs.short_sha }}
            UV_LOCK_SHA256=${{ steps.image-meta.outputs.lock_sha256 }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=nightly-${{ steps.image-meta.outputs.build_date }}-${{ steps.image-meta.outputs.short_sha }}
            org.astrbot.uv-lock-sha256=${{ steps.image-meta.outputs.lock_sha256 }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/astrbot:nightly-latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/astrbot:nightly-${{ steps.image-meta.outputs.build_date }}-${{ steps.image-meta.outputs.short_sha }}
            ${{ env.HAS_GHCR_TOKEN == 'true' && 'ghcr.io/astrbotdevs/astrbot:nightly-latest' || '' }}
            ${{ env.HAS_GHCR_TOKEN == 'true' && format('ghcr.io/astrbotdevs/astrbot:nightly-{0}-{1}', steps.image-meta.outputs.build_date, steps.image-meta.outputs.short_sha) || '' }}

  build-release-image:
    if: github.repository == 'AstrBotDevs/AstrBot' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    concurrency:
      group: astrbot-docker-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      cancel-in-progress: false
    env:
      HAS_GHCR_TOKEN: ${{ secrets.GHCR_GITHUB_TOKEN != '' }}

    steps:
      - name: Checkout tagged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Verify release tag and checkout
        id: release-meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_TAG"
          else
            version="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tag must be a safe semantic version: $version" >&2
            exit 1
          fi
          git fetch --force --tags origin "refs/tags/$version:refs/tags/$version"
          tag_commit="$(git rev-list -n1 "$version")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "Checked out commit does not match release tag $version." >&2
            exit 1
          fi
          if [[ "$version" == *beta* ]] || [[ "$version" == *alpha* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "lock_sha256=$(sha256sum uv.lock | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite immutable release tags
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_GITHUB_TOKEN }}
          VERSION: ${{ steps.release-meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          hub_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://hub.docker.com/v2/repositories/${DOCKER_HUB_USERNAME}/astrbot/tags/${VERSION}/")"
          if [ "$hub_status" != "404" ]; then
            echo "Docker Hub tag ${VERSION} already exists (HTTP ${hub_status})." >&2
            exit 1
          fi
          if [ -n "$GHCR_TOKEN" ]; then
            ghcr_bearer="$(
              curl --fail --silent --show-error \
                --user "astrbotdevs:${GHCR_TOKEN}" \
                "https://ghcr.io/token?service=ghcr.io&scope=repository:astrbotdevs/astrbot:pull" \
                | python3 -c 'import json, sys; print(json.load(sys.stdin).get("token", ""))'
            )"
            if [ -z "$ghcr_bearer" ]; then
              echo "Could not acquire a GHCR read token for immutable-tag verification." >&2
              exit 1
            fi
            ghcr_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer ${ghcr_bearer}" \
              --header 'Accept: application/vnd.oci.image.index.v1+json' \
              "https://ghcr.io/v2/astrbotdevs/astrbot/manifests/${VERSION}")"
            if [ "$ghcr_status" != "404" ]; then
              echo "GHCR tag ${VERSION} already exists or cannot be checked (HTTP ${ghcr_status})." >&2
              exit 1
            fi
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.13.0'
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Build Dashboard
        shell: bash
        run: |
          pnpm --dir dashboard install --frozen-lockfile
          pnpm --dir dashboard run build
          mkdir -p dashboard/dist/assets
          printf '%s\n' "${{ steps.release-meta.outputs.version }}" > dashboard/dist/assets/version
          mkdir -p astrbot/dashboard
          cp -a dashboard/dist astrbot/dashboard/dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Log in to GitHub Container Registry
        if: env.HAS_GHCR_TOKEN == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: astrbotdevs
          password: ${{ secrets.GHCR_GITHUB_TOKEN }}

      - name: Build and push immutable release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.release-meta.outputs.version }}
            UV_LOCK_SHA256=${{ steps.release-meta.outputs.lock_sha256 }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/astrbot:${{ steps.release-meta.outputs.version }}
            ${{ env.HAS_GHCR_TOKEN == 'true' && format('ghcr.io/astrbotdevs/astrbot:{0}', steps.release-meta.outputs.version) || '' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release-meta.outputs.version }}
            org.astrbot.uv-lock-sha256=${{ steps.release-meta.outputs.lock_sha256 }}

      - name: Promote stable release to latest
        if: steps.release-meta.outputs.is_prerelease == 'false'
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          HAS_GHCR_TOKEN: ${{ env.HAS_GHCR_TOKEN }}
          VERSION: ${{ steps.release-meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${DOCKER_HUB_USERNAME}/astrbot:latest" \
            "${DOCKER_HUB_USERNAME}/astrbot:${VERSION}"
          if [ "$HAS_GHCR_TOKEN" = "true" ]; then
            docker buildx imagetools create \
              --tag "ghcr.io/astrbotdevs/astrbot:latest" \
              "ghcr.io/astrbotdevs/astrbot:${VERSION}"
          fi
