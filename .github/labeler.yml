documentation:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - 'docs/**'
              - '*.md'
      - head-branch:
          - '^docs?[/-]'

github_actions:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/actions/**'

bug:
  - head-branch:
      - '^(fix|bugfix|hotfix)[/-]'
      - '^codex/fix[-_]'

enhancement:
  - head-branch:
      - '^(feat|feature|features)[/-]'

codex:
  - head-branch:
      - '^codex/'

area:webui:
  - changed-files:
      - any-glob-to-any-file:
          - 'dashboard/**'
          - 'astrbot/dashboard/**'
          - 'openspec/openapi-v1.yaml'

