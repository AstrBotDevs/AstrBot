# This fork does not operate a public issue tracker.
# https://docs.github.com/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository

blank_issues_enabled: false

contact_links:
  - name: 📖 Documentation / 文档
    url: https://github.com/Xero-Team/AstrBot/tree/master/docs
    about: |
      In-app docs are served at /help/ after starting the WebUI. Sources live
      in this repository under docs/zh and docs/en. This fork does not operate
      a public issue tracker.
      启动 WebUI 后文档在 /help/。源文件在本仓库 docs/zh 与 docs/en。本 fork
      不运营公开 Issue 跟踪器。

  - name: 🔒 Report a Security Vulnerability / 报告安全漏洞
    url: https://github.com/Xero-Team/AstrBot/security/advisories/new
    about: |
      Report security issues privately. Do NOT open a public issue.
      See SECURITY.md.
      安全漏洞请私密报告，切勿在公开 Issue 中提交，详见 SECURITY.md。
