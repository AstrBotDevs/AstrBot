# One-click deployment: AstrBot (built natively from this repo) + NapCat.
#
# Usage (after `git clone` of this repo):
#   docker compose -f compose-with-napcat.yml up -d --build
#
# On Linux, match NapCat's file ownership to your host user to avoid permission issues:
#   NAPCAT_UID=$(id -u) NAPCAT_GID=$(id -g) docker compose -f compose-with-napcat.yml up -d --build
#
# Ports:
#   6185 -> AstrBot WebUI         (http://localhost:6185)
#   6099 -> NapCat WebUI          (http://localhost:6099)
# AstrBot and NapCat reach each other inside `astrbot_network` by container name,
# so no QQ WebSocket port needs to be published to the host.

services:
  astrbot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        ASTRBOT_FEATURES: '${ASTRBOT_FEATURES:-full}'
    image: astrbot:local
    restart: always
    # Computer tools and Docker-backed integrations intentionally require full
    # container capabilities for this deployment profile.
    privileged: true
    init: true
    ports:
      - '${ASTRBOT_BIND_ADDRESS:-127.0.0.1}:6185:6185' # AstrBot WebUI
    environment:
      TZ: '${TZ:-Asia/Shanghai}'
      ASTRBOT_DASHBOARD_HOST: '0.0.0.0'
    volumes:
      - ./data:/AstrBot/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - astrbot_network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:6185/api/v1/openapi.json', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  docs:
    build:
      context: .
      dockerfile: Dockerfile.docs
    image: astrbot-docs:local
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    ports:
      - '${DOCS_BIND_ADDRESS:-127.0.0.1}:6186:8080' # AstrBot documentation
    networks:
      - astrbot_network

  napcat:
    image: mlikiowa/napcat-docker:latest@sha256:02ddf329894887552bc6207a41e471bcf51ef0f04751804905aeb8cf1f737d4f
    restart: always
    # NapCat's desktop/QQ runtime requires the same full-capability profile.
    privileged: true
    init: true
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
      - MODE=astrbot
    ports:
      - '${NAPCAT_BIND_ADDRESS:-127.0.0.1}:6099:6099' # NapCat WebUI
    volumes:
      - ./data:/AstrBot/data
      - ./napcat/config:/app/napcat/config
      - ./ntqq:/app/.config/QQ
    depends_on:
      astrbot:
        condition: service_healthy
    networks:
      - astrbot_network

networks:
  astrbot_network:
    driver: bridge
