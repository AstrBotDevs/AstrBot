        id:
          type: string
          pattern: '^[0-9a-f]{32}$'
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/gif]
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        image_url:
          type: string
        thumbnail_url:
          type: string

    AppearanceWallpaperResponse:
      type: object
      additionalProperties: false
      required: [status, data]
      properties:
        status:
          type: string
          enum: [ok]
        message:
          type: string
          nullable: true
        data:
          $ref: '#/components/schemas/AppearanceWallpaper'

    AppearanceWallpaperListResponse:
      type: object
      additionalProperties: false
      required: [status, data]
      properties:
        status:
          type: string
          enum: [ok]
        message:
          type: string
          nullable: true
        data:
          type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AppearanceWallpaper'

    PluginUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        proxy:
          type: string
          nullable: true

    PluginSourceBindRequest:
      type: object
      properties:
