  /api/v1/subagents/config:
    get:
      tags: [Subagents]
      summary: Get subagent orchestrator configuration
      operationId: getSubagentConfig
      x-astrbot-scope: config
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    put:
      tags: [Subagents]
      summary: Update subagent orchestrator configuration
      operationId: updateSubagentConfig
      x-astrbot-scope: config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubAgentConfigRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/subagents/available-tools:
    get:
      tags: [Subagents]
      summary: List tools available to subagents
      operationId: listSubagentAvailableTools
      x-astrbot-scope: config
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/webhooks/platforms/{webhook_uuid}:
    get:
      tags: [Webhooks]
      summary: Verify a platform webhook
      operationId: verifyPlatformWebhook
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookUuid'
      responses:
        '200':
          description: Webhook verification response
    post:
      tags: [Webhooks]
      summary: Receive a platform webhook
      operationId: receivePlatformWebhook
      security: []
      parameters:
        - $ref: '#/components/parameters/WebhookUuid'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicConfig'
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Webhook accepted

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    DashboardBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Dashboard session JWT
    DashboardCookieAuth:
      type: apiKey
      in: cookie
      name: astrbot_dashboard_jwt
  responses:
    Ok:
      description: Standard AstrBot success response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    Error:
      description: Standard AstrBot error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Text:
      description: Text response
      content:
        text/plain:
          schema:
            type: string
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    Html:
      description: HTML response
      content:
        text/html:
          schema:
            type: string

  parameters:
    AppearanceWallpaperId:
      name: wallpaper_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    ExtensionId:
      name: extension_id
      in: path
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 128
        pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+$'
    PluginPageId:
      name: page_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 48
        pattern: '^[a-z][a-z0-9-]{0,47}$'
    PluginActionId:
      name: action_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
        pattern: '^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$'
    AttachmentId:
      name: attachment_id
      in: path
      required: true
      schema:
        type: string
    AttachmentIdQuery:
      name: attachment_id
      in: query
      required: true
      schema:
        type: string
    BotId:
      name: bot_id
      in: path
      required: true
      schema:
        type: string
    ChunkId:
      name: chunk_id
      in: path
      required: true
      schema:
        type: string
    CommandId:
      name: command_id
      in: path
      required: true
      description: URL-encoded command handler full name.
      schema:
        type: string
    ConfigId:
      name: config_id
      in: path
      required: true
      schema:
        type: string
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        type: string
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
    FilePath:
      name: file_path
      in: path
      required: true
      description: URL-encoded relative file path.
      schema:
        type: string
    FactId:
      name: fact_id
      in: path
      required: true
      schema:
        type: integer
    Filename:
      name: filename
      in: path
      required: true
      schema:
        type: string
    FolderId:
      name: folder_id
      in: path
      required: true
      schema:
        type: string
    GroupId:
      name: group_id
      in: path
      required: true
      schema:
        type: string
    KbId:
      name: kb_id
      in: path
      required: true
      schema:
        type: string
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    PersonaId:
      name: persona_id
      in: path
      required: true
      schema:
        type: string
    PluginId:
      name: plugin_id
      in: path
      required: true
      schema:
        type: string
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    ServerName:
      name: server_name
      in: path
      required: true
      schema:
        type: string
    SkillName:
      name: skill_name
      in: path
      required: true
      schema:
        type: string
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
    ToolId:
      name: tool_id
      in: path
      required: true
      schema:
        type: string
    Umo:
      name: umo
      in: path
      required: true
      description: URL-encoded unified message origin.
      schema:
        type: string
    WebhookUuid:
      name: webhook_uuid
      in: path
      required: true
      schema:
        type: string

  schemas:
    SuccessEnvelope:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [ok, warning]
        message:
          type: string
        data: {}
      additionalProperties: false

    SkillInventoryItem:
      type: object
      required: [name, description, path, active]
      properties:
        name:
          type: string
        description:
          type: string
        path:
          type: string
        active:
          type: boolean
        source_type:
          type: string
        source_label:
          type: string
        plugin_name:
          type: string
        plugin_active:
          type: boolean
          description: Whether the owning plugin is active in the runtime catalog.
        plugin_display_name:
          type: string
          description: Display name of the owning runtime plugin, when known.
        readonly:
          type: boolean
      additionalProperties: true

    SkillInventoryData:
      type: object
      required: [skills, runtime, sandbox_cache]
      properties:
        skills:
          type: array
          items:
            $ref: '#/components/schemas/SkillInventoryItem'
        runtime:
          type: string
        sandbox_cache:
          type: object
          additionalProperties: true
      additionalProperties: false

    SkillInventoryResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [ok, warning]
        message:
          type: string
        data:
          $ref: '#/components/schemas/SkillInventoryData'
      additionalProperties: false

    ErrorEnvelope:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          const: error
        message:
          type: string
        data: {}
      additionalProperties: false

    DynamicConfig:
      type: object
      additionalProperties: true

    JsonSchema:
      type: object
      additionalProperties: true

    PluginDashboardSessionRequest:
      type: object
      required: [protocol_version, expected_generation]
      properties:
        protocol_version:
          type: integer
          const: 1
        expected_generation:
          type: string
          minLength: 1
          maxLength: 128
      additionalProperties: false

    PluginDashboardActionRequest:
      type: object
      required: [protocol_version, instance_id, expected_generation, payload]
      properties:
        protocol_version:
          type: integer
          const: 1
        instance_id:
          type: string
          minLength: 1
          maxLength: 128
        expected_generation:
          type: string
          minLength: 1
          maxLength: 128
        payload: {}
      additionalProperties: false

    PluginDashboardFileRequest:
      type: object
      required:
        [
          protocol_version,
          instance_id,
          expected_generation,
          expected_disposition,
          payload,
        ]
      properties:
        protocol_version:
          type: integer
          const: 1
        instance_id:
          type: string
          minLength: 1
          maxLength: 128
        expected_generation:
          type: string
          minLength: 1
          maxLength: 128
        expected_disposition:
          type: string
          enum: [inline, attachment]
        payload: {}
      additionalProperties: false

    PluginDashboardUploadMetadata:
      type: object
      required: [protocol_version, instance_id, expected_generation, fields]
      properties:
        protocol_version:
          type: integer
          const: 1
        instance_id:
          type: string
          minLength: 1
          maxLength: 128
        expected_generation:
          type: string
          minLength: 1
          maxLength: 128
        fields: {}
      additionalProperties: false

    PluginDashboardUploadRequest:
      type: object
      required: [metadata, file]
      properties:
        metadata:
          $ref: '#/components/schemas/PluginDashboardUploadMetadata'
        file:
          type: string
          format: binary
      additionalProperties: false

    PluginDashboardPage:
      type: object
      required: [id, title, icon, actions]
      properties:
        id:
          type: string
        title:
          type: string
        icon:
          type: [string, 'null']
        actions:
          type: array
          items:
            type: string
      additionalProperties: false

    PluginDashboardAction:
      type: object
      required: [id, kind, required_scope, description, input_schema]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [json, upload, file]
        required_scope:
          type: string
        description:
          type: string
        input_schema:
          $ref: '#/components/schemas/JsonSchema'
        output_schema:
          $ref: '#/components/schemas/JsonSchema'
        disposition:
          type: string
          enum: [inline, attachment]
        max_file_bytes:
          type: integer
          minimum: 1
        allowed_content_types:
          type: array
          items:
            type: string
        allowed_extensions:
          type: array
          items:
            type: string
      additionalProperties: false

    PluginDashboardCatalog:
      type: object
      required:
        [
          protocol_version,
          extension_id,
          plugin_name,
          plugin_generation,
          pages,
          actions,
        ]
      properties:
        protocol_version:
          type: integer
          const: 1
        extension_id:
          type: string
        plugin_name:
          type: string
        plugin_generation:
          type: string
        pages:
          type: array
          items:
            $ref: '#/components/schemas/PluginDashboardPage'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/PluginDashboardAction'
      additionalProperties: false

    PluginDashboardCatalogResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          const: ok
        message:
          type: [string, 'null']
        data:
          $ref: '#/components/schemas/PluginDashboardCatalog'
      additionalProperties: false

    PluginDashboardSession:
      type: object
      required:
        [
          protocol_version,
          instance_id,
          plugin_generation,
          iframe_url,
          handshake_nonce,
          expires_at,
        ]
      properties:
        protocol_version:
          type: integer
          const: 1
        instance_id:
          type: string
        plugin_generation:
          type: string
        iframe_url:
          type: string
        handshake_nonce:
          type: string
        expires_at:
          type: string
          format: date-time
      additionalProperties: false

    PluginDashboardSessionResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          const: ok
        message:
          type: [string, 'null']
        data:
          $ref: '#/components/schemas/PluginDashboardSession'
      additionalProperties: false

    PluginDashboardFileTicket:
      type: object
      required:
        [ticket_url, filename, content_type, size, disposition, expires_at]
      properties:
        ticket_url:
          type: string
        filename:
          type: string
        content_type:
          type: string
        size:
          type: integer
          minimum: 0
        disposition:
          type: string
          enum: [inline, attachment]
        expires_at:
          type: string
          format: date-time
      additionalProperties: false

    PluginDashboardFileResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          const: ok
        message:
          type: [string, 'null']
        data:
          $ref: '#/components/schemas/PluginDashboardFileTicket'
      additionalProperties: false

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        code:
          type: string
          description: TOTP code or recovery code when two-factor authentication is required.
        trust_device_flag:
          type: boolean
      additionalProperties: false

    SetupAuthRequest:
      type: object
      required: [username, password, confirm_password]
      properties:
        username:
          type: string
        password:
          type: string
        confirm_password:
          type: string
      additionalProperties: false

    UpdateAccountRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
        new_password:
          type: string
        confirm_password:
          type: string
        new_username:
          type: string
      additionalProperties: false

    TotpSetupRequest:
      type: object
      properties:
        code:
          type: string
        secret:
          type: string
      additionalProperties: false

    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum:
              [
                bot,
                provider,
                persona,
                im,
                config,
                chat,
                kb,
                memory,
                data,
                file,
                plugin,
                mcp,
                skill,
              ]
          example:
            [
              bot,
              provider,
              persona,
              im,
              config,
              chat,
              kb,
              memory,
              data,
              file,
              plugin,
              mcp,
              skill,
            ]
        expires_at:
          type: string
          format: date-time
        expires_in_days:
          type: integer
          minimum: 1
      additionalProperties: false

    CreateConfigProfileRequest:
      type: object
      properties:
        name:
          type: string
        config:
          $ref: '#/components/schemas/DynamicConfig'
      additionalProperties: false

    RenameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
      additionalProperties: false

    NameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
      additionalProperties: false

    ConfigRoutesReplaceRequest:
      type: object
      required: [routing]
      properties:
        routing:
          type: object
          additionalProperties:
            type: string
      additionalProperties: false

    ConfigRouteUpsertRequest:
      type: object
      required: [config_id]
      properties:
        config_id:
          type: string
