        registration_code:
          type: string
        device_code:
          type: string
        qrcode:
          type: string
      additionalProperties: true

    EnabledPatch:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
      additionalProperties: false

    ProviderSourceConfigRequest:
      type: object
      required: [config]
      properties:
        config:
          $ref: '#/components/schemas/DynamicConfig'
      additionalProperties: false

    ProviderConfigRequest:
      type: object
      required: [config]
      properties:
        config:
          $ref: '#/components/schemas/DynamicConfig'
      additionalProperties: false

    ProviderEmbeddingDimensionRequest:
