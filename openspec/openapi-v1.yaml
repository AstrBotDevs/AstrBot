          type: array
          items:
            type: string
      additionalProperties: false

    ChatSessionPatchRequest:
      type: object
      properties:
        display_name:
          type: string
      additionalProperties: false

    ChatMessagePatchRequest:
      type: object
      required: [content]
      properties:
        content:
          type: object
          additionalProperties: true
      additionalProperties: false

    ChatMessageRegenerateRequest:
      type: object
      properties:
        selected_provider:
          type: string
        selected_model:
          type: string
        enable_streaming:
          type: boolean
          default: true
      additionalProperties: false

    ChatThreadCreateRequest:
      type: object
      required: [session_id, parent_message_id, selected_text]
      properties:
        session_id:
          type: string
        parent_message_id:
          oneOf:
            - type: string
            - type: integer
        selected_text:
          type: string
      additionalProperties: false

    ChatThreadMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/MessagePart'
        selected_provider:
          type: string
        selected_model:
          type: string
        enable_streaming:
          type: boolean
          default: true
      additionalProperties: false

    ChatProjectRequest:
      type: object
      properties:
        title:
          type: string
        emoji:
          type: string
        description:
          type: string
      additionalProperties: false

    MessagePart:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [text, plain, image, file, audio, record, video, reply]
        text:
          type: string
        attachment_id:
          type: string
        url:
          type: string
        filename:
          type: string
        stored_filename:
          type: string
        mime_type:
          type: string
      additionalProperties: true

    ImMessageRequest:
      type: object
      required: [umo, message]
      properties:
        umo:
          type: string
        message:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/MessagePart'
      additionalProperties: false

    FileUploadRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary

    AppearanceWallpaperUploadRequest:
      type: object
      required: [file]
      additionalProperties: false
      properties:
        file:
          type: string
          format: binary

    AppearanceWallpaper:
      type: object
      additionalProperties: false
      required: [id, content_type, width, height, image_url, thumbnail_url]
