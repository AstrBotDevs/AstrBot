openapi: 3.1.0
info:
  title: AstrBot OpenAPI v1
  version: 0.1.0
  description: >
    Target REST contract for migrating AstrBot HTTP APIs to /api/v1.
    Dynamic AstrBot configuration payloads are intentionally modeled as open
    JSON objects because their schemas are provided at runtime by template
    endpoints.
    Developer API keys currently support these scopes only: bot, provider,
    persona, im, config, chat, kb, memory, data, file, plugin, mcp, and skill.
    The config scope also grants bot and provider access.
x-astrbot-scope-definitions:
  bot:
    description: Manage bot and platform configurations.
    description_zh: 管理机器人及平台配置。
  provider:
    description: Manage model providers and provider sources.
    description_zh: 管理模型服务提供商和提供商源。
  persona:
    description: Manage personas and persona folders.
    description_zh: 管理人格设定和人格文件夹。
  im:
    description: Send proactive IM messages and query bot or platform identifiers.
    description_zh: 主动发送 IM 消息，并查询机器人或平台标识。
  config:
    description: Manage configuration profiles and system configuration.
    description_zh: 管理配置文件和系统配置。
    includes: [bot, provider]
  chat:
    description: Use chat capabilities and manage ChatUI sessions and projects.
    description_zh: 调用对话能力，并管理 ChatUI 会话和项目。
  kb:
    description: Manage knowledge bases.
    description_zh: 管理知识库。
  memory:
    description: Manage memory data.
    description_zh: 管理记忆数据。
  data:
    description: Manage Dashboard data operations.
    description_zh: 管理 Dashboard 数据操作。
  file:
    description: Manage files.
    description_zh: 管理文件。
  plugin:
    description: Manage plugins.
    description_zh: 管理插件。
  mcp:
    description: Manage MCP servers.
    description_zh: 管理 MCP 服务器。
  skill:
    description: Manage skills.
    description_zh: 管理技能。
servers:
  - url: http://localhost:6185
    description: Local AstrBot server

security:
  - ApiKeyAuth: []

tags:
  - name: Open API
  - name: Auth
  - name: API Keys
  - name: Authorization
  - name: System Config
  - name: Config Profiles
  - name: Bot Config Routes
  - name: Bots
  - name: Provider Sources
  - name: Providers
  - name: Chat
  - name: IM
  - name: Files
  - name: Appearance
  - name: Plugins
  - name: Plugin Dashboard
  - name: Plugin Sources
  - name: Commands
  - name: Tools
  - name: MCP
  - name: Skills
  - name: Knowledge Base
  - name: Memory
  - name: Personas
  - name: Sessions
  - name: Conversations
  - name: Stats
  - name: Backups
  - name: Updates
  - name: Cron
  - name: Logs
  - name: T2I
  - name: Subagents
  - name: Webhooks

paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login to the dashboard API
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Error'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout from the dashboard API
      operationId: logout
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/auth/setup-status:
    get:
      tags: [Auth]
      summary: Get first-run setup status
      operationId: getAuthSetupStatus
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/auth/setup:
    post:
      tags: [Auth]
      summary: Complete first-run dashboard account setup
      operationId: setupAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupAuthRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/auth/totp/setup:
    post:
      tags: [Auth]
      summary: Start or refresh TOTP setup
      operationId: setupTotp
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpSetupRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/auth/totp/recovery:
    post:
      tags: [Auth]
      summary: Generate or rotate TOTP recovery codes
      operationId: recoverTotp
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/auth/account:
    patch:
      tags: [Auth]
      summary: Update dashboard account credentials
      operationId: updateAuthAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/api-keys:
    get:
      tags: [API Keys]
      summary: List OpenAPI keys
      operationId: listApiKeys
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    post:
      tags: [API Keys]
      summary: Create an OpenAPI key
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/api-keys/{key_id}/revoke:
    post:
      tags: [API Keys]
      summary: Revoke an OpenAPI key
      operationId: revokeApiKey
      parameters:
        - $ref: '#/components/parameters/KeyId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/api-keys/{key_id}:
    delete:
      tags: [API Keys]
      summary: Delete an OpenAPI key
      operationId: deleteApiKey
      parameters:
        - $ref: '#/components/parameters/KeyId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/authorization/role-bindings:
    get:
      tags: [Authorization]
      summary: List role bindings
      operationId: listAuthorizationRoleBindings
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    post:
      tags: [Authorization]
      summary: Grant a scoped role binding
      operationId: grantAuthorizationRoleBinding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationBindingRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/authorization/role-bindings/{binding_id}/revoke:
    post:
      tags: [Authorization]
      summary: Revoke a scoped role binding
      operationId: revokeAuthorizationRoleBinding
      parameters:
        - name: binding_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/authorization/role-bindings/batch-revoke/step-up:
    post:
      tags: [Authorization]
      summary: Reauthenticate for one exact batch role-binding revocation
      operationId: issueAuthorizationBatchRevokeStepUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationBindingBatchRevokeRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/authorization/role-bindings/batch-revoke:
    post:
      tags: [Authorization]
      summary: Revoke one exact batch of scoped role bindings
      operationId: revokeAuthorizationRoleBindings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationBindingBatchRevokeRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/authorization/step-up:
    post:
      tags: [Authorization]
      summary: Reauthenticate and issue a one-time step-up credential
      operationId: issueAuthorizationStepUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationStepUpRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/authorization/audit:
    get:
      tags: [Authorization]
      summary: List redacted authorization audit records
      operationId: listAuthorizationAudit
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/authorization/accounts:
    get:
      tags: [Authorization]
      summary: List stable Dashboard accounts
      operationId: listAuthorizationAccounts
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    post:
      tags: [Authorization]
      summary: Create a Dashboard account and global role binding
      operationId: createAuthorizationAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardAccountCreateRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/authorization/accounts/{account_id}:
    patch:
      tags: [Authorization]
      summary: Update or disable a Dashboard account
      operationId: updateAuthorizationAccount
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardAccountUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/system-config/schema:
    get:
      tags: [System Config]
      summary: Get the system configuration schema
      operationId: getSystemConfigSchema
      x-astrbot-scope: config
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/system-config:
    get:
      tags: [System Config]
      summary: Get the system configuration
      operationId: getSystemConfig
      x-astrbot-scope: config
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    put:
      tags: [System Config]
      summary: Replace the system configuration
      operationId: updateSystemConfig
      x-astrbot-scope: config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicConfig'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/system-config/runtime:
    get:
      tags: [System Config]
      summary: Get runtime-enriched system configuration metadata
      operationId: getSystemConfigRuntime
      x-astrbot-scope: config
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/config-profiles/schema:
    get:
      tags: [Config Profiles]
      summary: Get the configuration profile schema
      operationId: getConfigProfileSchema
      x-astrbot-scope: config
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/config-profiles:
    get:
      tags: [Config Profiles]
      summary: List configuration profiles
      operationId: listConfigProfiles
      x-astrbot-scope: config
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    post:
      tags: [Config Profiles]
      summary: Create a configuration profile
      operationId: createConfigProfile
      x-astrbot-scope: config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConfigProfileRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/config-profiles/{config_id}:
    get:
      tags: [Config Profiles]
      summary: Get a configuration profile
      operationId: getConfigProfile
      x-astrbot-scope: config
      parameters:
        - $ref: '#/components/parameters/ConfigId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    put:
      tags: [Config Profiles]
      summary: Replace a configuration profile
      operationId: updateConfigProfileContent
      x-astrbot-scope: config
      parameters:
        - $ref: '#/components/parameters/ConfigId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicConfig'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    patch:
      tags: [Config Profiles]
      summary: Rename a configuration profile
      operationId: renameConfigProfile
      x-astrbot-scope: config
      parameters:
        - $ref: '#/components/parameters/ConfigId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    delete:
      tags: [Config Profiles]
      summary: Delete a configuration profile
      operationId: deleteConfigProfile
      x-astrbot-scope: config
      parameters:
        - $ref: '#/components/parameters/ConfigId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/config-routes:
    get:
      tags: [Bot Config Routes]
      summary: List UMO to configuration profile bindings
      operationId: listConfigRoutes
      x-astrbot-scope: config
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    put:
      tags: [Bot Config Routes]
      summary: Replace all UMO to configuration profile bindings
      operationId: replaceConfigRoutes
      x-astrbot-scope: config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigRoutesReplaceRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/config-routes/{umo}:
    put:
      tags: [Bot Config Routes]
      summary: Bind a UMO to a configuration profile
      operationId: upsertConfigRoute
      x-astrbot-scope: config
      parameters:
        - $ref: '#/components/parameters/Umo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigRouteUpsertRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    delete:
      tags: [Bot Config Routes]
      summary: Remove a UMO configuration profile binding
      operationId: deleteConfigRoute
      x-astrbot-scope: config
      parameters:
        - $ref: '#/components/parameters/Umo'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/bot-types:
    get:
      tags: [Bots]
      summary: List configurable bot types and their schemas
      operationId: listBotTypes
      x-astrbot-scope: bot
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/bot-types/{bot_type}/registration:
    post:
      tags: [Bots]
      summary: Run a bot type registration flow action
      operationId: registerBotType
      x-astrbot-scope: bot
      parameters:
        - name: bot_type
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotRegistrationRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/bots:
    get:
      tags: [Bots]
      summary: List created bots and their configurations
      operationId: listBots
      x-astrbot-scope: bot
      parameters:
        - name: enabled
          in: query
          schema:
            type: boolean
        - name: type
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    post:
      tags: [Bots]
      summary: Create a bot from configuration
      operationId: createBot
      x-astrbot-scope: bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotConfigRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/bots/stats:
    get:
      tags: [Bots]
      summary: List runtime status for all bots
      operationId: listBotStats
      x-astrbot-scope: bot
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/bots/{bot_id}:
    get:
      tags: [Bots]
      summary: Get a bot configuration
      operationId: getBot
      x-astrbot-scope: bot
      parameters:
        - $ref: '#/components/parameters/BotId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    put:
      tags: [Bots]
      summary: Replace a bot configuration
      operationId: updateBot
      x-astrbot-scope: bot
      parameters:
        - $ref: '#/components/parameters/BotId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotConfigRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    delete:
      tags: [Bots]
      summary: Delete a bot
      operationId: deleteBot
      x-astrbot-scope: bot
      parameters:
        - $ref: '#/components/parameters/BotId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/bots/{bot_id}/enabled:
    patch:
      tags: [Bots]
      summary: Enable or disable a bot
      operationId: setBotEnabled
      x-astrbot-scope: bot
      parameters:
        - $ref: '#/components/parameters/BotId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnabledPatch'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/bots/{bot_id}/test:
    post:
      tags: [Bots]
      summary: Test a bot registration or connection
      operationId: testBot
      x-astrbot-scope: bot
      parameters:
        - $ref: '#/components/parameters/BotId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/bots/{bot_id}/actions:
    post:
      tags: [Bots]
      summary: Invoke a supported bot platform action
      operationId: invokeBotAction
      x-astrbot-scope: bot
      parameters:
        - $ref: '#/components/parameters/BotId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/providers/schema:
    get:
      tags: [Providers]
      summary: Get the overall provider configuration schema
      operationId: getProviderSchema
      x-astrbot-scope: provider
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/provider-sources:
    get:
      tags: [Provider Sources]
      summary: List provider sources
      operationId: listProviderSources
      x-astrbot-scope: provider
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    post:
      tags: [Provider Sources]
      summary: Create a provider source
      operationId: createProviderSource
      x-astrbot-scope: provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderSourceConfigRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/provider-sources/{source_id}:
    get:
      tags: [Provider Sources]
      summary: Get a provider source
      operationId: getProviderSource
      x-astrbot-scope: provider
      parameters:
        - $ref: '#/components/parameters/SourceId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    put:
      tags: [Provider Sources]
      summary: Update a provider source or create it if missing
      operationId: upsertProviderSource
      x-astrbot-scope: provider
      parameters:
        - $ref: '#/components/parameters/SourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderSourceConfigRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    delete:
      tags: [Provider Sources]
      summary: Delete a provider source and providers that reference it
      operationId: deleteProviderSource
      x-astrbot-scope: provider
      parameters:
        - $ref: '#/components/parameters/SourceId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/provider-sources/{source_id}/models:
    get:
      tags: [Provider Sources]
      summary: List models available from a provider source
      operationId: listProviderSourceModels
      x-astrbot-scope: provider
      parameters:
        - $ref: '#/components/parameters/SourceId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/provider-sources/{source_id}/providers:
    get:
      tags: [Providers]
      summary: List providers under a provider source
      operationId: listProvidersBySource
      x-astrbot-scope: provider
      parameters:
        - $ref: '#/components/parameters/SourceId'
        - name: provider_type
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    post:
      tags: [Providers]
      summary: Create a provider under a provider source
      operationId: createProviderInSource
      x-astrbot-scope: provider
      parameters:
        - $ref: '#/components/parameters/SourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderConfigRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/providers:
    get:
      tags: [Providers]
      summary: List providers by provider type or source
      operationId: listProviders
      x-astrbot-scope: provider
      parameters:
        - name: provider_type
          in: query
          schema:
            type: string
        - name: provider_source_id
          in: query
          schema:
            type: string
        - name: enabled
          in: query
          schema:
            type: boolean
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    post:
      tags: [Providers]
      summary: Create a standalone provider
      operationId: createProvider
      x-astrbot-scope: provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderConfigRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/providers/{provider_id}:
    get:
      tags: [Providers]
      summary: Get a provider configuration
      operationId: getProvider
      x-astrbot-scope: provider
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - name: merged
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    put:
      tags: [Providers]
      summary: Replace a provider configuration
      operationId: updateProvider
      x-astrbot-scope: provider
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderConfigRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    delete:
      tags: [Providers]
      summary: Delete a provider
      operationId: deleteProvider
      x-astrbot-scope: provider
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderEmbeddingDimensionRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/providers/{provider_id}/enabled:
    patch:
      tags: [Providers]
      summary: Enable or disable a provider
      operationId: setProviderEnabled
      x-astrbot-scope: provider
      parameters:
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnabledPatch'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/v1/providers/{provider_id}/test:
    post:
      tags: [Providers]
      summary: Test a provider
      operationId: testProvider
