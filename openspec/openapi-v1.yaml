        install_method:
          type: string
        registry_url:
          type: string
          nullable: true
        market_plugin_id:
          type: string
      additionalProperties: false

    PluginUrlInstallRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        download_url:
          type: string
          format: uri
          description: Optional downloadable ZIP URL when url is the plugin source page or repository.
        proxy:
          type: string
        ignore_version_check:
          type: boolean
        install_method:
          type: string
        registry_url:
          type: string
          nullable: true
        market_plugin_id:
          type: string
      additionalProperties: false

    PluginUploadInstallRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary

    PluginConfigFileDeleteRequest:
      type: object
      required: [path]
      properties:
        path:
