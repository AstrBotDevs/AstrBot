version: '3.8'

# 当接入 QQ NapCat 时，请使用这个 compose 文件一键部署: https://github.com/NapNeko/NapCat-Docker/blob/main/compose/astrbot.yml

services:
  astrbot:
    image: soulter/astrbot:latest
    container_name: astrbot
    restart: always
    ports: # mappings description: https://github.com/AstrBotDevs/AstrBot/issues/497
      - "127.0.0.1:6185:6185" # WebUI; use a TLS reverse proxy for remote access
    environment:
      - TZ=Asia/Shanghai
      - ASTRBOT_DASHBOARD_HOST=0.0.0.0
      - ASTRBOT_DASHBOARD_ACCESS_MODE=container_loopback
      - SHIPYARD_ENDPOINT=${SHIPYARD_ENDPOINT:?set a remote HTTPS Shipyard endpoint}
      - SHIPYARD_ACCESS_TOKEN=${SHIPYARD_ACCESS_TOKEN:?set a high-entropy token}
    volumes:
      - ${PWD}/data:/AstrBot/data
      # - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
