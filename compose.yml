version: '3.8'

# When connecting to OneBot v11 Napcat, please use this compose file for one-click deployment: https://github.com/NapNeko/NapCat-Docker/blob/main/compose/astrbot.yml

services:
  astrbot:
    image: soulter/astrbot:latest
    container_name: astrbot
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:6185:6185" # AstrBot WebUI; use a TLS reverse proxy for remote access
    environment:
      - TZ=Asia/Shanghai
      - ASTRBOT_DASHBOARD_HOST=0.0.0.0
      - ASTRBOT_DASHBOARD_ACCESS_MODE=container_loopback
    volumes:
      - ./data:/AstrBot/data
      # - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
