[project]
name = "fish-api"
version = "0.1.0"
description = "Fish platform API — auth, billing, AstrBot binding"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.10.0",
    "bcrypt>=4.2.0",
    "sqlalchemy>=2.0.36",
    "httpx>=0.28.0",
    "uvicorn[standard]>=0.32.0",
    "alembic>=1.20.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
