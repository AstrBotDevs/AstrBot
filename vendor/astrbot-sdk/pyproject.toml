[project]
name = "astrbot-sdk"
version = "0.1.0"
description = "Public Rust-backed and Python SDK and plugin runtime for AstrBot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "packaging>=24.2",
    "pyyaml>=6.0",
    "websockets>=13",
]

[project.optional-dependencies]
schema = [
    "pydantic>=2,<3",
]
test = [
    "pydantic>=2,<3",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    # Legacy compat replay runs handlers in real Quart/Starlette contexts.
    "quart>=0.20",
    "starlette>=0.47",
    "fastapi>=0.124",
    "aiofiles>=25.1",
]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/astrbot-py/Cargo.toml"
python-source = "src"
module-name = "astrbot_sdk._native"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC"]
